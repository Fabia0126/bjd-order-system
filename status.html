<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单查询 - BJD送妆</title>
    <link rel="stylesheet" href="style.css?v=cards-v1">
    <script src="vendor/supabase-js-2.118.0.js"></script>
    <link rel="stylesheet" href="receipt-ui.css?v=cards-v1">

<body>
    <div class="container">
        <header>
            <h1>订单查询</h1>
            <p class="subtitle">凭投递成功后保存的查询凭据查看本人的进度</p>
        </header>

        <section id="localReceipts" class="receipt-card local-records" hidden>
            <p class="receipt-eyebrow">本机留存</p>
            <h2>本机投递记录</h2>
            <p class="search-hint">点一条记录查看最新进度。这里仅显示本浏览器保存的记录，徽章为最近已知状态。</p>
            <div id="savedReceipts" class="record-list"></div>
        </section>

        <div class="search-section">
            <p class="receipt-eyebrow">投递进度</p>
            <h2>查询我的订单</h2>
            <label class="visually-hidden" for="searchInput">查询凭据</label>
            <input type="text" class="search-input" id="searchInput" placeholder="粘贴43位查询凭据" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="43">
            <button class="search-btn" id="queryButton" type="button">查询订单</button>
            <p class="search-hint">查询凭据仅供本人保存；旧订单请联系阿发核验。</p>
        </div>

        <div class="result-section" id="resultSection">
            <!-- 动态填充 -->
        </div>

        <a href="weather.html" class="calendar-link">☀️ 查看新昌晴天日历 — 工期按晴天计算</a>
        <a href="index.html" class="back-link">← 返回首页</a>
    </div>
